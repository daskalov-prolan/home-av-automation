[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avhub"
version = "0.1.0"
description = "Home automation hub for audio/video devices (receivers, TVs, projectors, HDMI matrices, media players)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
avhub = "avhub.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/avhub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
